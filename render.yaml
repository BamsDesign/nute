# Blueprint Render — site vitrine NUTE : HTML/CSS/JS statique, aucune étape de build.
# Render → New → Blueprint → dépôt BamsDesign/nute → Apply. Chaque push sur `main` republie le site.
# L'ancienne version Next.js est conservée dans la branche `version-nextjs`.
services:
  - type: web
    runtime: static
    name: nute
    branch: main
    buildCommand: echo "Site statique — pas de build"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      # Anciennes adresses du site Next.js → nouvelles pages
      - { type: redirect, source: /equipe, destination: /equipe.html }
      - { type: redirect, source: /equipe/*, destination: /equipe.html }
      - { type: redirect, source: /services, destination: /#services }
      - { type: redirect, source: /services/*, destination: /#services }
      - { type: redirect, source: /realisations, destination: /#realisations }
      - { type: redirect, source: /realisations/*, destination: /#realisations }
      - { type: redirect, source: /interventions, destination: /#lieux }
      - { type: redirect, source: /interventions/*, destination: /#lieux }
      - { type: redirect, source: /activites, destination: /#evenements }
      - { type: redirect, source: /activites/*, destination: /#evenements }
      - { type: redirect, source: /formations, destination: /#formation }
      - { type: redirect, source: /a-propos, destination: /#mission }
      - { type: redirect, source: /contact, destination: /#contact }
      - { type: redirect, source: /actualites, destination: / }
      - { type: redirect, source: /actualites/*, destination: / }
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      # CSP : Google Fonts, photos hébergées sur Higgsfield (CDN), panneau /admin (Decap CMS via unpkg + API GitHub)
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://d8j0ntlcm91z4.cloudfront.net https://d2ol7oe51mr4n9.cloudfront.net https://avatars.githubusercontent.com https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://unpkg.com; frame-ancestors 'none'; form-action 'self' mailto:; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /assets/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /content/*
        name: Cache-Control
        value: no-cache
