# Blueprint Render — site NUTE : base PostgreSQL + service web Next.js.
# Les médias sont stockés dans la base (MEDIA_STORAGE=db) : aucun disque requis.
databases:
  - name: nute-db
    databaseName: nute
    user: nute
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: nute
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci && npm run render-build
    startCommand: npm start
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nute-db
          property: connectionString
      - key: MEDIA_STORAGE
        value: db
      - key: SITE_URL
        value: https://nute-dixz.onrender.com
      - key: ADMIN_PATH
        value: espace-nute
      - key: CONTACT_NOTIFY_TO
        value: nuteservices@gmail.com
      # Compte administrateur créé au premier déploiement (à saisir dans le tableau de bord Render).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
